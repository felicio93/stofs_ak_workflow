# =============================================================================
# project.yaml — Project-level settings
# =============================================================================

# Two-digit project identifier (e.g. "01", "02").
# This determines the directory naming convention:
#   M{id}/  I{id}/  R{id}/  P{id}/
project_id: "01"

# Which model configuration to run. Selects the driver under
# workflow/models/<model_type>/. Supported:
#   schism       SCHISM standalone (implemented)
#   schism_wwm   SCHISM + WWM, internally coupled (planned)
#   schism_mice  SCHISM + MICE, internally coupled (planned)
#   ufs_coastal  UFS-Coastal based variants (implemented)
model_type: schism #ufs_coastal

# Absolute path to the project directory on the HPC filesystem.
# The workflow will create M{id}/ and all subdirectories here.
project_dir: /work2/noaa/nos-surge/felicioc/STOFS_3D_AK

# Simulation start and end dates (inclusive). Format: YYYY-MM-DD
# The workflow will generate one time group per calendar month
# between these dates.
start_date: "2025-09-01"
end_date:   "2025-12-31"

# Time grouping for inputs and run directories.
# Only "monthly" is supported at this time.
grouping: monthly

# -----------------------------------------------------------------------------
# SLURM settings (used by steps that submit jobs, e.g. plot_hycom).
# -----------------------------------------------------------------------------
slurm:
  account: nos-surge
  partition: hercules-2
  mail_user: felicio.cassalho@noaa.gov
  plot_walltime: "00:20:00"
  plot_mem: "16G"            # memory per plotting task; increase if OOM errors occur
  inspect_walltime: "00:10:00"
  inspect_mem: "16G"         # memory for inspect_mesh job
  schism_walltime: "01:00:00"
  schism_mem: "8G"           # memory for gen_3Dth and gen_nudge (open boundary only)
  hotstart_walltime: "01:00:00"
  hotstart_mem: "64G"        # memory for gen_hotstart (full 3M-node mesh x 50 levels)
  gen_sflux_walltime: "01:00:00"
  gen_sflux_mem: "8G"        # memory per gen_sflux task
  plot_sflux_walltime: "00:30:00"
  plot_sflux_mem: "16G"      # memory per plot_sflux task
  # Phase 5 postprocessing:
  plot_outputs_qos: windfall      # windfall QOS supports large node counts
                                   # (55 nodes for 1092 files). debug QOS has
                                   # node limits that prevent large MPI jobs.
                                   # Override to 'debug' only for small runs.
  plot_outputs_walltime: "02:00:00"
  plot_outputs_mem: "16G"    # memory per MPI rank (one output file per rank;
                             # 20 ranks/node → ~25 GB headroom on 512 GB nodes)
  plot_outputs_max_ntasks:   # optional cap on MPI ranks (default: one per file)
  plot_outputs_gif_walltime: "00:30:00"
  plot_outputs_gif_mem: "32G"    # serial GIF assembly (loads all frames)
  compare_sst_walltime: "01:00:00"
  compare_sst_mem: "24G"     # memory per MPI rank (one day per rank;
                             # 10 ranks/node → ~51 GB headroom on 512 GB nodes)
  compare_sst_max_ntasks:    # optional cap on MPI ranks (default: one per day)
  compare_sst_gif_walltime: "00:30:00"
  compare_sst_gif_mem: "16G"
  diag_run_walltime: "00:10:00"
  diag_run_mem: "16G"        # per-stack diagnostic frames during the run

# -----------------------------------------------------------------------------
# SCHISM executable names (must be present in M{id}/bin/).
# -----------------------------------------------------------------------------
executables:
  gen_hotstart: gen_hot_from_hycom_0_noscaling.exe
  gen_3Dth:     gen_3Dth_from_hycom_noscaling.exe
  gen_nudge:    gen_nudge_from_hycom_noscaling.exe
  # Phase 4 (run management):
  #schism:           pschism_HERCULES_NO_PARMETIS_PREC_EVAP_BLD_STANDALONE_SH_MEM_COMM_TVD-VL
  ufs_schism: fv3_datm2sch.exe
  combine_hotstart: combine_hotstart7.exe
