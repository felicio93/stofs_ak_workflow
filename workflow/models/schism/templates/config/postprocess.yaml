# =============================================================================
# postprocess.yaml — Phase 5 post-processing settings
# =============================================================================
# Copied into your project's config/ directory. Loaded automatically by
# workflow.core.config.load_config (optional file).

# Depth isobaths (metres) overlaid on ALL plots (diagnostics, field GIFs,
# SST comparison). Extracted from the mesh 'depth' in out2d/hgrid.
isobaths: [200, 2000]

# =============================================================================
# diag_run_plots — per-output-stack diagnostic frames DURING the run
# =============================================================================
# Static images (no GIF), one per timestep per variable, written to
# D{ID}/D{ID}_YYYYMM/diag/ as each SCHISM output stack completes. Dispatched
# by auto_hotstart.py from the Phase-4 monitoring loop. Enable BEFORE setup_run
# so the hook is baked into the run directories.
#
# Variable entry fields (shared by diag_run_vars and plot_outputs_vars):
#   file_prefix : NetCDF filename prefix without _{N}.nc
#                 New I/O: e.g. out2d, temperature, salinity
#                 Old I/O (UFS-SCHISM): ignored — all vars are in schout_N.nc
#   var_name    : variable name (use New I/O names — old I/O is mapped
#                 automatically; see variable name mapping table below)
#   label       : colorbar / title text (include units)
#   cmap        : matplotlib colormap
#   vmin / vmax : color limits (null = robust 2nd/98th percentile)
#   is_3d       : true if the variable has a vertical (sigma) dimension
#   layer       : "surface" | "bottom" | integer index (only used if is_3d)
#   loc         : "node" (default) or "elem" (element-centered)
#
# diag_run_vars: the quick health-check subset plotted live during the run.
diag_run_vars:
  - {file_prefix: out2d,          var_name: elevation,      label: "SSH (m)",   cmap: RdBu_r, vmin: -2,   vmax: 2,    is_3d: false}
  - {file_prefix: temperature,    var_name: temperature,    label: "SST (°C)",  cmap: jet,    vmin: -2,   vmax: 12,   is_3d: true, layer: surface}
  - {file_prefix: salinity,       var_name: salinity,       label: "SSS (psu)", cmap: viridis,vmin: 30,   vmax: 34.5, is_3d: true, layer: surface}
  - {file_prefix: horizontalVelX, var_name: horizontalVelX, label: "U (m/s)",   cmap: RdBu_r, vmin: -1.5, vmax: 1.5,  is_3d: true, layer: surface}
  - {file_prefix: horizontalVelY, var_name: horizontalVelY, label: "V (m/s)",   cmap: RdBu_r, vmin: -1.5, vmax: 1.5,  is_3d: true, layer: surface}
diag_run_dpi: 150

# =============================================================================
# plot_outputs — full-run field GIFs (after the run completes)
# =============================================================================
#
# OUTPUT FORMAT NOTE
# ------------------
# Works for BOTH output formats automatically:
#
#   New I/O (SCHISM standalone): separate per-variable files
#     (out2d_N.nc, temperature_N.nc, etc.). file_prefix is used to locate
#     the correct file.
#
#   Old I/O (UFS-SCHISM): all variables in schout_N.nc.
#     file_prefix is IGNORED. Variable names are translated automatically
#     using the mapping table below.
#
# VARIABLE NAME MAPPING (old I/O -> new I/O)
# ------------------------------------------
# Use the var_name column (New I/O names) in all configurations.
# The adapter maps them to old I/O names automatically at runtime.
#
#   New I/O var_name        Old I/O variable    Dimensions
#   ----------------        ----------------    ----------
#   elevation               elev                2D node
#   temperature             temp                3D node
#   salinity                salt                3D node
#   horizontalVelX          hvel                3D node vector (component 0, eastward)
#   horizontalVelY          hvel                3D node vector (component 1, northward)
#   verticalVelocity        vertical_velocity   3D node
#   waterDensity            water_density       3D node
#   turbulentKineticEner    TKE                 3D node
#   mixingLength            mixing_length       3D node
#   diffusivity             diffusivity         3D node
#   viscosity               viscosity           3D node
#   airPressure             air_pressure        2D node
#   airTemperature          air_temperature     2D node
#   specificHumidity        specific_humidity   2D node
#   solarRadiation          solar_radiation     2D node
#   sensibleHeat            sensible_flux       2D node
#   latentHeat              latent_heat         2D node
#   upwardLongwave          upward_longwave     2D node
#   downwardLongwave        downward_longwave   2D node
#   totalHeat               total_heat_flux     2D node
#   evaporationRate         evaporation         2D node
#   precipitationRate       precipitation       2D node
#   windSpeedX              wind_speed          2D node vector (component 0)
#   windSpeedY              wind_speed          2D node vector (component 1)
#   windStressX             wind_stress         2D node vector (component 0)
#   windStressY             wind_stress         2D node vector (component 1)
#
plot_outputs_vars:
  # --- 2D node-centered variables ---
  - {file_prefix: out2d,          var_name: elevation,         label: "Water Level (m)",              cmap: RdBu_r,   vmin: -2,     vmax: 2,      is_3d: false}
  - {file_prefix: out2d,          var_name: airPressure,       label: "Air Pressure (Pa)",            cmap: viridis,  vmin: 96000,  vmax: 104000, is_3d: false}
  - {file_prefix: out2d,          var_name: airTemperature,    label: "Air Temperature (°C)",         cmap: RdYlBu_r, vmin: -15,    vmax: 25,     is_3d: false}
  - {file_prefix: out2d,          var_name: specificHumidity,  label: "Specific Humidity (kg/kg)",    cmap: YlGnBu,   vmin: 0,      vmax: 0.02,   is_3d: false}
  - {file_prefix: out2d,          var_name: solarRadiation,    label: "Solar Radiation (W/m²)",       cmap: YlOrRd,   vmin: 0,      vmax: 800,    is_3d: false}
  - {file_prefix: out2d,          var_name: sensibleHeat,      label: "Sensible Heat (W/m²)",         cmap: RdBu_r,   vmin: -100,   vmax: 300,    is_3d: false}
  - {file_prefix: out2d,          var_name: latentHeat,        label: "Latent Heat (W/m²)",           cmap: RdBu_r,   vmin: -50,    vmax: 400,    is_3d: false}
  - {file_prefix: out2d,          var_name: upwardLongwave,    label: "Upward Longwave (W/m²)",       cmap: YlOrRd,   vmin: 250,    vmax: 450,    is_3d: false}
  - {file_prefix: out2d,          var_name: downwardLongwave,  label: "Downward Longwave (W/m²)",     cmap: YlOrRd,   vmin: 150,    vmax: 450,    is_3d: false}
  - {file_prefix: out2d,          var_name: totalHeat,         label: "Total Heat Flux (W/m²)",       cmap: RdBu_r,   vmin: -400,   vmax: 400,    is_3d: false}
  - {file_prefix: out2d,          var_name: evaporationRate,   label: "Evaporation (kg/m²/s)",        cmap: YlGnBu,   vmin: 0,      vmax: 1.0e-4, is_3d: false}
  - {file_prefix: out2d,          var_name: precipitationRate, label: "Precipitation (kg/m²/s)",      cmap: YlGnBu,   vmin: 0,      vmax: 5.0e-4, is_3d: false}
  - {file_prefix: out2d,          var_name: windSpeedX,        label: "Wind U (m/s)",                 cmap: RdBu_r,   vmin: -25,    vmax: 25,     is_3d: false}
  - {file_prefix: out2d,          var_name: windSpeedY,        label: "Wind V (m/s)",                 cmap: RdBu_r,   vmin: -25,    vmax: 25,     is_3d: false}
  - {file_prefix: out2d,          var_name: windStressX,       label: "Wind Stress X (Pa)",           cmap: RdBu_r,   vmin: -0.01,  vmax: 0.01,   is_3d: false}
  - {file_prefix: out2d,          var_name: windStressY,       label: "Wind Stress Y (Pa)",           cmap: RdBu_r,   vmin: -0.01,  vmax: 0.01,   is_3d: false}
  # --- 3D node-centered variables ---
  - {file_prefix: temperature,    var_name: temperature,       label: "Temperature (°C)",             cmap: jet,     vmin: -2,      vmax: 12,     is_3d: true, layer: surface}
  - {file_prefix: salinity,       var_name: salinity,          label: "Salinity (psu)",               cmap: viridis, vmin: 30,      vmax: 34.5,   is_3d: true, layer: surface}
  - {file_prefix: horizontalVelX, var_name: horizontalVelX,    label: "Horizontal Vel X (m/s)",       cmap: RdBu_r,  vmin: -1.5,    vmax: 1.5,    is_3d: true, layer: surface}
  - {file_prefix: horizontalVelY, var_name: horizontalVelY,    label: "Horizontal Vel Y (m/s)",       cmap: RdBu_r,  vmin: -1.5,    vmax: 1.5,    is_3d: true, layer: surface}
  - {file_prefix: verticalVelocity,    var_name: verticalVelocity,   label: "Vertical Velocity (m/s)",  cmap: RdBu_r,  vmin: -5.0e-4, vmax: 5.0e-4, is_3d: true, layer: surface}
  - {file_prefix: waterDensity,        var_name: waterDensity,       label: "Water Density (kg/m³)",    cmap: viridis, vmin: 1015,    vmax: 1028,   is_3d: true, layer: surface}
  - {file_prefix: diffusivity,         var_name: diffusivity,        label: "Diffusivity (m²/s)",       cmap: viridis, vmin: 0,       vmax: 0.01,   is_3d: true, layer: surface}
  - {file_prefix: viscosity,           var_name: viscosity,          label: "Viscosity (m²/s)",         cmap: viridis, vmin: 0,       vmax: 0.01,   is_3d: true, layer: surface}
  - {file_prefix: turbulentKineticEner, var_name: turbulentKineticEner, label: "TKE (m²/s²)",           cmap: viridis, vmin: 0,       vmax: 0.01,   is_3d: true, layer: surface}
  - {file_prefix: mixingLength,        var_name: mixingLength,       label: "Mixing Length (m)",        cmap: viridis, vmin: 0,       vmax: 0.5,    is_3d: true, layer: surface}
  # --- SCHISM+WWM wave variables (in out2d_*.nc) ---
  - {file_prefix: out2d, var_name: sigWaveHeight,      label: "Significant Wave Height (m)",  cmap: turbo,   vmin: 0,    vmax: 6,    is_3d: false}
  - {file_prefix: out2d, var_name: meanWavePeriod,     label: "Mean Wave Period (s)",          cmap: viridis, vmin: 0,    vmax: 20,   is_3d: false}
  - {file_prefix: out2d, var_name: zeroDowncrossPeriod,label: "Zero-Downcross Period (s)",     cmap: viridis, vmin: 0,    vmax: 20,   is_3d: false}
  - {file_prefix: out2d, var_name: meanWaveDirection,  label: "Mean Wave Direction (deg)",     cmap: hsv,     vmin: 0,    vmax: 360,  is_3d: false}
  - {file_prefix: out2d, var_name: peakPeriod,         label: "Peak Wave Period (s)",          cmap: viridis, vmin: 0,    vmax: 25,   is_3d: false}

# Date range for the GIF (null = whole run). Format YYYY-MM-DD.
plot_outputs_start: null
plot_outputs_end:   null

# Temporal cadence in HOURS. Only timesteps landing on this cadence
# (from 00:00Z) are plotted. e.g. 6 = 4 frames/day.
plot_outputs_every_hours: 6

# GIF frames per second and per-frame DPI.
plot_outputs_fps: 4
plot_outputs_dpi: 150

# =============================================================================
# SST comparison (model vs LEO L3S-DY satellite)
# =============================================================================
# The L3S-LEO-DY product is a DAILY collated field. Matching options:
#   daily_mean : arithmetic daily mean of SCHISM surface temperature (default)
#   nearest    : SCHISM surface temperature nearest 12:00Z
sst_match: daily_mean

# Date range for the comparison GIF (null = whole run).
compare_sst_start: null
compare_sst_end:   null

compare_sst_vmin: -2
compare_sst_vmax: 12
compare_sst_cmap: jet
compare_sst_fps:  4
compare_sst_dpi:  150

# =============================================================================
# Frame retention
# =============================================================================
# true  = keep individual JPEG frames after building the GIF
# false = delete frames once the GIF is written
keep_frames: true

# =============================================================================
# CO-OPS station observations (download_coops + station_skill)
# =============================================================================
coops_datum: MSL
coops_variables: [WL, T, air_pressure, wind]

# =============================================================================
# NDBC buoy observations (download_ndbc + station_skill)
# =============================================================================
ndbc_variables: null

# =============================================================================
# station_skill — obs vs model time-series plots + skill CSV
# =============================================================================
station_skill_start: null
station_skill_end:   null
station_skill_resample: "1h"

# =============================================================================
# Argo float collocation (download_argo + collocate_argo)
# =============================================================================
argo_region: pacific_ocean
collocate_argo_vars: [temperature, salinity]
collocate_argo_n_nearest: 3
collocate_argo_temporal_interp: true
collocate_argo_dist_threshold_km: 5
collocate_argo_start: null
collocate_argo_end:   null

# plot_argo settings
collocate_argo_plot_max_depth: 300
collocate_argo_plot_max_dist_km: null
collocate_argo_plot_dpi: 150

# --- Plot 1: Location map ---
collocate_argo_plot_location_cmap: turbo
collocate_argo_plot_location_s: 14

# --- Plot 2: Skill histograms ---
collocate_argo_plot_hist_bins: 40
collocate_argo_plot_r2_xlim: [0, 1]
collocate_argo_plot_temp_bias_xlim: null
collocate_argo_plot_temp_rmse_xlim: null
collocate_argo_plot_psal_bias_xlim: null
collocate_argo_plot_psal_rmse_xlim: null
collocate_argo_plot_temp_hist_color: royalblue
collocate_argo_plot_psal_hist_color: teal

# --- Plot 3: Profile matrix ---
collocate_argo_plot_temp_xlim: null
collocate_argo_plot_psal_xlim: null
collocate_argo_plot_temp_color: royalblue
collocate_argo_plot_psal_color: teal
collocate_argo_plot_profile_alpha: 0.15
collocate_argo_plot_profile_lw: 0.8

# --- Plot 4: Spatial skill map ---
collocate_argo_plot_rmse_cmap: plasma
collocate_argo_plot_r2_cmap: RdYlGn
collocate_argo_plot_skill_max_depth: null
collocate_argo_plot_temp_rmse_vmax: null
collocate_argo_plot_psal_rmse_vmax: null
collocate_argo_plot_skill_s: 20

# =============================================================================
# Satellite altimetry collocation (SCHISM+WWM Hs vs satellite Hs)
# =============================================================================
# Source: 'cci' (default, IFREMER FTP) or 'coastwatch' (NOAA STAR)
#
# CCI requires credentials as environment variables (never stored here):
#   export CCI_FTP_USER="your_username"
#   export CCI_FTP_PASS="your_password"
# Register at https://eftp.ifremer.fr (free).
#
# CoastWatch has no credentials but caps SWH at 8 m and may delete
# old data without notice.
altimetry_source: cci

# Satellite list. null = all satellites available for the chosen source.
#
# CCI options (16 total):
#   cfosat, cryosat-2, envisat, ers-1, ers-2, gfo,
#   jason-1, jason-2, jason-3, saral, sentinel-3a,
#   sentinel-3b, sentinel-6a, swot,
#   topex-poseidon_poseidon, topex-poseidon_topex
#
# CoastWatch options:
#   sentinel3a, sentinel3b, jason3
altimetry_sat_list: null

# Collocation window (null = whole run). Format: YYYY-MM-DD
collocate_altimetry_start: null
collocate_altimetry_end:   null

# Number of nearest model nodes for spatial collocation
collocate_altimetry_n_nearest: 3

# plot_altimetry settings
altimetry_plot_dpi: 150
altimetry_plot_min_quality: 3       # obs_swh_quality_level threshold (0-3, 3=good)
altimetry_plot_max_dist_km: null    # optional: only use obs within X km of a model node
altimetry_scatter_vmax_hs: null     # null = 98th percentile of Hs values
altimetry_scatter_time_delta_vmax: null   # minutes, null = auto 98th percentile
altimetry_scatter_dist_delta_vmax: null   # km, null = auto 98th percentile
