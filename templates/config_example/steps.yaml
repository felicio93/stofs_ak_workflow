# =============================================================================
# steps.yaml — Step execution flags
# =============================================================================
# Set a step to true to enable it, false to skip it.
# Run the workflow one step at a time: enable one step, test it,
# then disable it and enable the next.
#
# Steps are grouped by phase. Preprocessing steps run with:
#     stofs-ak --run --config <config_dir>            (phase defaults to preprocess)
# Run-management and post-processing steps run with:
#     stofs-ak --run --phase run         --config <config_dir>
#     stofs-ak --run --phase postprocess --config <config_dir>
#
# Phase 0 — Mesh diagnostics (SLURM job, run before any other step):
inspect_mesh: false   # Plot all fix/ input files + mesh resolution + vertical layers

# Phase 1 — DTN only (requires internet access):
download_hycom:  false
download_era5:   false   # Download ERA5 monthly raw files (one file per month)
download_glofas: false   # Download GloFAS v4 reanalysis discharge (one file per year)

# Phase 2 — Any node, no internet required:
aggregate_hycom: false  # Concatenate HYCOM daily -> monthly SCHISM stacks

# plotting_debug submits SLURM job arrays (one task per month).
plotting_debug: false   # HYCOM debug GIFs (temperature, salinity, ssh)
plot_sflux:     false   # ERA5/sflux debug GIFs (6-hourly, all variables)

# Phase 3 — SCHISM preprocessing (no internet required):
# Run gen_estuary first (once, interactive) before submitting SLURM steps.
gen_estuary:  false   # Step A: create fix/estuary.gr3 + bin/*.in files (once, interactive)
gen_bctides:  false   # Step B: create bctides.in per month from TPXO9 (interactive)
gen_source:   false   # Step C: GloFAS discharge -> source.nc per month (interactive)
gen_param:    false   # Step D: copy fix/param.nml to each I{ID}_YYYYMM/ with correct dates (interactive)
gen_sflux:    false   # Step E: ERA5 raw -> sflux_air/prc/rad per month (SLURM array)
gen_hotstart: false   # Step F: create hotstart.nc (once, first month only, SLURM)
gen_3Dth:     false   # Step G: create *[23D].th.nc files (SLURM array, one job per month)
gen_nudge:    false   # Step H: create TEM/SAL_nu.nc files (SLURM array, one job per month)

# =============================================================================
# Phase 4 — Run management (NOT YET IMPLEMENTED — placeholders)
# Run with:  stofs-ak --run --phase run --config <config_dir>
# =============================================================================
submit_run:      false   # Submit SCHISM run jobs per month (R{ID}_YYYYMM/)
monitor_run:     false   # Poll SLURM, detect completion/failure, write run.done
chain_hotstart:  false   # Promote hotstart from month N -> month N+1 run dir

# =============================================================================
# Phase 5 — Post-processing (NOT YET IMPLEMENTED — placeholders)
# Run with:  stofs-ak --run --phase postprocess --config <config_dir>
# =============================================================================
plot_outputs:    false   # Animated maps of water level / currents / SSS / SST
station_extract: false   # Extract model time series at CO-OPS/NDBC stations
skill_metrics:   false   # RMSE, bias, correlation, skill vs observations
compare_sst:     false   # Compare modeled SST vs satellite (GOES/VIIRS/OI-SST)
