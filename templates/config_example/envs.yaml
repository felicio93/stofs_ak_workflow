# =============================================================================
# envs.yaml — Conda environment settings
# =============================================================================

# Absolute path to your conda/miniconda installation base directory.
conda_base: /work2/noaa/nos-surge/felicioc/envs/miniconda3

# Per-step conda environment name.
# Only steps that invoke Python need an entry here.
# Steps that only call Fortran binaries or shell commands do not need one.
#
# Two usage patterns:
#
#   1. Phase 1 steps run INSIDE the activated env (interactive on the DTN).
#      For these, the env name is used only for VERIFICATION: the workflow
#      warns if the currently active conda env does not match. It does not
#      switch environments.
#        e.g. download_hycom -> hycom_env
#
#   2. Phase 2 compute-node steps CALL a specific env by full interpreter path
#      (no conda activate needed in non-interactive shells):
#        base env:    {conda_base}/bin/python
#        named env:   {conda_base}/envs/{env_name}/bin/python
conda_envs:
  download_hycom: ak_workflow
  aggregate_hycom: base
