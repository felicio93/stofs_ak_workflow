# =============================================================================
# steps.yaml — Step execution flags
# =============================================================================
# Set a step to true to enable it, false to skip it.
# Run the workflow one step at a time: enable one step, test it,
# then disable it and enable the next.
#
# Steps are grouped by phase. Preprocessing steps run with:
#     stofs-ak --run --config <config_dir>            (phase defaults to preprocess)
# Run-management and post-processing steps run with:
#     stofs-ak --run --phase run         --config <config_dir>
#     stofs-ak --run --phase postprocess --config <config_dir>
#
# Phase 0 — Mesh diagnostics (SLURM job, run before any other step):
inspect_mesh: false   # Plot all fix/ input files + mesh resolution + vertical layers

# Phase 1 — DTN only (requires internet access):
download_hycom:  false
download_era5:   false   # Download ERA5 monthly raw files (one file per month)
download_glofas: false   # Download GloFAS v4 reanalysis discharge (one file per year)

# Phase 2 — Any node, no internet required:
aggregate_hycom: false  # Concatenate HYCOM daily -> monthly SCHISM stacks

# plot_hycom submits SLURM job arrays (one task per month).
plot_hycom: false   # HYCOM debug GIFs (temperature, salinity, ssh)
plot_sflux:     false   # ERA5/sflux debug GIFs (6-hourly, all variables)
gen_datm: false   # Convert SCHISM sflux -> CDEPS DATM forcing NetCDF (UFS-SCHISM)
plot_datm: false   # DATM debug GIFs (6-hourly, all variables)
gen_esmf_mesh: false # Generate ESMF mesh file from DATM grid

# Phase 3 — SCHISM preprocessing (no internet required):
# Run gen_estuary first (once, interactive) before submitting SLURM steps.
gen_estuary:  false   # Step A: create fix/estuary.gr3 + bin/*.in files (once, interactive)
gen_bctides:  false   # Step B: create bctides.in per month from TPXO9 (interactive)
gen_source:   false   # Step C: GloFAS discharge -> source.nc per month (interactive)
gen_param:    false   # Step D: copy fix/param.nml to each I{ID}_YYYYMM/ with correct dates (interactive)
gen_sflux:    false   # Step E: ERA5 raw -> sflux_air/prc/rad per month (SLURM array)
gen_hotstart: false   # Step F: create hotstart.nc (once, first month only, SLURM)
gen_3Dth:     false   # Step G: create *[23D].th.nc files (SLURM array, one job per month)
gen_nudge:    false   # Step H: create TEM/SAL_nu.nc files (SLURM array, one job per month)

# =============================================================================
# Phase 4 — Run management
# Run with:  stofs-ak --run --phase run --config <config_dir>
# =============================================================================
setup_run:  false   # Populate R{ID}_YYYYMM/ dirs: symlink fix/ + I{ID}_YYYYMM/
                    # inputs, copy executables, adapt run_test/run_comb job cards,
                    # write auto_hotstart.py (interactive, fast)
submit_run: false   # Run auto_hotstart.py month-by-month, chaining hotstarts.
                    # Blocking — launch inside screen/tmux (see tutorial).

# =============================================================================
# Phase 5 — Post-processing
# Run with:  stofs-ak --run --phase postprocess --config <config_dir>
# Variables/layers/cadence configured in postprocess.yaml.
# =============================================================================
diag_run_plots:  false   # Per-output-stack diagnostic frames -> D{ID} DURING the
                         # run (dispatched by auto_hotstart.py). Enable BEFORE
                         # setup_run so it is baked into the run directories.
download_sst:    false   # DTN: download LEO L3S-DY satellite SST + subset -> M{ID}/obs/
download_coops:  false   # DTN: download NOAA CO-OPS station obs (WL, water temp, air
                         # pressure, wind) -> M{ID}/obs/coops/ (based on fix/station.in)
download_ndbc:   false   # DTN: download NOAA NDBC buoy obs (WTMP, wind, PRES) ->
                         # M{ID}/obs/ndbc/ (annual + current-year monthly + realtime)
download_argo:   false   # DTN: download Argo float profiles (IFREMER GDAC via OCSTrack)
                         # -> M{ID}/obs/argo/{region}/processed/ (domain-cropped)
plot_outputs:    false   # Full-run field GIFs -> P{ID} (SLURM: parallel frames + GIF)
compare_sst:     false   # Model vs satellite SST GIF -> P{ID} (needs download_sst first)
station_skill:   false   # Interactive: CO-OPS/NDBC obs vs model staout_* time-series
                         # plots + skill_metrics.csv -> P{ID} (needs download_coops/ndbc first)
collocate_argo:  false   # Interactive: OCSTrack 3-D collocation of SCHISM T/S profiles
                         # vs Argo floats -> P{ID}/P{ID}_collocate_argo/ (needs download_argo)
plot_argo:       false   # Interactive: Argo diagnostic plots (location map, skill
                         # histograms, profile matrix) -> P{ID}/P{ID}_collocate_argo/
