# =============================================================================
# domain.yaml — Spatial domain settings
# =============================================================================

# Bounding box for data downloads. All values in decimal degrees.
# These should generously cover the model domain and any sponge/nudging layers.
lon_min: 150.0
lon_max: 230.0
lat_min:  45.0
lat_max:  78.0

# Longitude reference frame used by the mesh (hgrid.gr3).
# This ensures downloaded data is consistent with the grid coordinate system.
#
# Options:
#   "180"    ->  -180 to +180, with 0 at Greenwich  (standard geographic)
#   "360"    ->     0 to  360, with 0 at Greenwich  (e.g. Bering Sea models
#                              where 180 crosses the domain)
#
# The Bering Sea / Alaska model uses "360".
#
# NOTE: The "360" path is the proven production path. The "180" convention is
# implemented but not yet validated against real HYCOM data (experimental).
lon_reference: "360"

# -----------------------------------------------------------------------------
# Debug plotting options (used by the plotting_debug step).
# -----------------------------------------------------------------------------
# Colormap for all HYCOM debug plots.
plot_cmap: jet

# Color scale limits per variable. Use [auto, auto] to derive robust limits
# from the 2nd/98th percentiles of the data (adapts to any domain/season), or
# set explicit numeric bounds, e.g. [-2, 16].
plot_temp_range: [-2, 16]
plot_salt_range: [31.5, 34]
plot_ssh_range:  [-1, 1]
