# Candidate vertical grids for the Alaska meshes (round 2), scored with
#   python -m workflow.core.vgrid_eval --hgrid <fix>/hgrid.gr3 \
#          --candidates docs/vgrid_candidates_alaska.yaml --out vgrid_eval.txt
# Each entry is a modelsetup.yaml vgrid: block; the first is the cost
# reference (prisms = 1.00). Copy the chosen one into modelsetup.yaml.
#   current          Alaska recipe of M26/M27, M70-M72 (meshes clipped at 3 m)
#   m73_hybrid       M73: current for nodes >= 3 m, shallow ramp below
#                    (1 layer over land and <= 1 m, masters every 0.25 m,
#                    11 layers at 3 m)
#   opt_smooth*      M74 candidates: the same shallow ramp, then masters close
#                    together in depth (layer count changes by at most ~2
#                    between nearby depths), bottom stretching theta_b only on
#                    the shelf (4th value of a class), z-like slope and deep;
#                    _lean / _rich: 2 fewer / more levels on 13-220 m
#   opt_rich_round1  round-1 candidate (theta_b 0.3 everywhere), for reference
#   stofs_atl        STOFS-3D-Atlantic template (deepest class at 9000 m)

