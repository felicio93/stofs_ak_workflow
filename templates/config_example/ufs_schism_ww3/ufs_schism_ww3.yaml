# =============================================================================
# ufs_schism_ww3.yaml — UFS-SCHISM+WW3 parameters
# =============================================================================
# Self-contained: only <model_type>.yaml is loaded, so the SCHISM keys shared
# by every model are included here (Part 1) before the model-specific keys
# (Part 2: DATM, coupling and WW3).

# =============================================================================
# PART 1 — SCHISM parameters (shared by all models)
# =============================================================================
# Temperature and salinity assigned to estuary nodes (shallow nodes with
# depth < estuary_depth_threshold in domain.yaml). These represent the
# background coastal/estuarine water properties.
estuary_temp: 10.0   # degrees C  (reasonable for Alaska coastal waters)
estuary_sal:  0.0    # psu        (freshwater end-member)

# Temperature and salinity assigned to mesh nodes that fall outside the
# HYCOM data coverage (safety fallback -- should rarely/never be triggered
# if the HYCOM download domain is generous).
outside_temp: 10.0
outside_sal:  0.0

# Open boundary condition flags for each open boundary in hgrid.gr3 (in order).
# Format: [[iettype, ifltype, itetype, isatype], ...]
#   iettype: elevation   (0=none, 1=elev.th, 2=constant, 3=tidal, 4=th.nc, 5=tidal+th.nc)
#   ifltype: velocity    (0=none, 1=flux.th, 2=constant, 3=tidal, 4=th.nc, 5=tidal+th.nc)
#   itetype: temperature (0=none, 1=T.th, 2=constant, 4=th.nc)
#   isatype: salinity    (0=none, 1=S.th, 2=constant, 4=th.nc)
open_boundary_flags: [[5, 5, 4, 4], [5, 5, 4, 4]]

# Tidal nudging relaxation factors per boundary (required when itetype/isatype != 0).
tobc: [0.01, 0.01]   # temperature nudging factor per boundary
sobc: [0.01, 0.01]   # salinity nudging factor per boundary

# Tidal constituents for bctides.in.
# Options:
#   'major' : 8 major constituents  [Q1, O1, P1, K1, N2, M2, S2, K2]
#   'all'   : all 15 available in TPXO9:
#              [M2, S2, N2, K2, K1, O1, P1, Q1, Mm, Mf, M4, MN4, MS4, 2N2, S1]
#   list    : explicit subset, e.g. [M2, S2, K1, O1, N2, P1, Q1, K2, Mm, Mf]
tidal_constituents: major

# Cutoff depth for applying earth tidal potential (metres).
tidal_cutoff_depth: 50.0

# Open boundary segment IDs for *th.nc files (gen_3Dth step).
# Format: [id1, id2, ...] matching the gen_3Dth_from_nc.in convention.
# For the AK mesh: 2 open boundaries, IDs 1 and 2.
open_boundaries: [1, 2]

# Time step of the HYCOM input data in seconds (daily data = 86400).
hycom_dt: 86400.0

# Output stride for the nudging timeseries (1 = output every input timestep).
nudge_stride: 1

# Parameters for the hotstart .in file (passed to gen_hot_from_nc.in).
# nbin and mne_bin are internal binning parameters for the Fortran interpolation.
# The defaults from the SCHISM repository work for most cases.
nbin:    60000
mne_bin: 1600

# =============================================================================
# Run management (Phase 4)
# =============================================================================
# When a monthly run completes and its end-of-month hotstart is combined,
# should the workflow automatically symlink that hotstart into the NEXT month's
# run directory and launch it?
#   true  : chain month N -> month N+1 automatically (normal production run)
#   false : single-group testing. submit_run launches the FIRST pending group
#           only; later groups have no hotstart.nc link until you chain them
#           yourself, so do not use false for multi-group production runs.
chain_hotstart: true

# =============================================================================
# PART 2 — UFS-SCHISM+WW3 parameters
# =============================================================================
# -----------------------------------------------------------------------------
# DATM settings
# -----------------------------------------------------------------------------
datm_subdir: forcing
datm_filename_template: "datm_{YYYYMM}.nc"
dt_atmos: 720

# -----------------------------------------------------------------------------
# Coupling interval
# -----------------------------------------------------------------------------
coupling_dt: 3600

# -----------------------------------------------------------------------------
# UFS model coupling configuration
# -----------------------------------------------------------------------------
# Update petlist_bounds to match your job allocation before running setup_run.
#
# Current allocation (fix/run_test):
#   48 nodes x 80 cores = 3840 total tasks (--exclusive)
#   ATM (DATM):   PETs   0 -  159  (160 tasks,  2 nodes)
#   OCN (SCHISM): PETs 160 - 3353 (3194 tasks, 40 nodes)
#   WAV (WW3):    PETs 3354 - 3833  (480 tasks,  6 nodes)
#   MED (CMEPS):  shares ATM petlist (0-159)
#   Total: 3834 tasks on 48 nodes
#
med_model: "cmeps"
atm_model: "datm"
ocn_model: "schism"
wav_model: "ww3"
cpl_mode: "coastal"
coupling_config: "none"
case_name: "ufs.cpld"
med_petlist_bounds: "0 159"
atm_petlist_bounds: "0 159"
ocn_petlist_bounds: "160 3353"
wav_petlist_bounds: "3354 3833"
med_omp_num_threads: 1
atm_omp_num_threads: 1
ocn_omp_num_threads: 1
wav_omp_num_threads: 1

# -----------------------------------------------------------------------------
# Mediator (CMEPS) PIO settings
# pio_typename: PNETCDF (parallel NetCDF, fast) or NETCDF (serial, slow)
# pio_stride:   every Nth rank is an I/O task
#               number of I/O tasks = total_tasks / pio_stride
#               e.g. 3834 / 8 = ~480 I/O tasks
# Using PNETCDF + stride=8 matches Yunfang's proven configuration and
# reduces mediator restart write time from ~60 min to ~5 min.
# -----------------------------------------------------------------------------
med_pio_typename: "PNETCDF"
med_pio_stride: 8

# -----------------------------------------------------------------------------
# WW3 ESMF mesh file (symlinked from fix/ into each run directory).
# Generated from scrip.nc using:
#   ESMF_Scrip2Unstruct scrip.nc ww3_ESMFmesh.nc 0
# scrip.nc is produced by ww3_grid (requires SCRIPNC in the WW3 switch).
# ww3_ESMFmesh.nc is the ESMF unstructured mesh format required by WW3 NUOPC cap.
# -----------------------------------------------------------------------------
wav_mesh_file: ww3_ESMFmesh.nc

# -----------------------------------------------------------------------------
# WW3 PIO (parallel I/O) settings
# pio_numiotasks: number of I/O tasks for WW3 output
# pio_stride:     stride between I/O tasks (-99 = auto)
# pio_rearranger: data rearranger method ('box' recommended)
# pio_root:       root I/O task (-99 = auto)
# -----------------------------------------------------------------------------
wav_pio_typename: "pnetcdf"
wav_pio_numiotasks: 4
wav_pio_stride: -99
wav_pio_rearranger: "box"
wav_pio_root: -99

# -----------------------------------------------------------------------------
# WW3 point output cadence [seconds]
# Must match DELTC in ww3_shel.nml &output_date_nml date%point
# and DELTC=1800 in wwminput.nml &STATION (for consistency with WWM runs)
# -----------------------------------------------------------------------------
ww3_point_output_dt: 1800

# -----------------------------------------------------------------------------
# WW3 static fixed files to symlink from fix/ into each run directory.
# These never change between groups.
# Note: scrip.nc is NOT listed here — it is only needed to generate
# ww3_ESMFmesh.nc and is not required at runtime.
# -----------------------------------------------------------------------------
ww3_fix_files:
  - mod_def.ww3
  - namelists.nml
  - ww3_points.list
  - ST4TABUHF2.bin
  - ww3_ESMFmesh.nc
  - mesh.msh

# -----------------------------------------------------------------------------
# WW3 restart chaining between groups (read by setup_run, applied by
# auto_hotstart.py when chain_hotstart is true).
# true:  copy ufs.cpld.ww3.r.<date>.nc from each finished group into the
#        next group's run directory (production default).
# false: do NOT copy the WW3 restart; WW3 cold-starts in every group.
#        DATM and mediator restarts are still chained.
# If this key is missing it defaults to true.
# -----------------------------------------------------------------------------
chain_ww3_restart: true
