# Candidate vertical grids for the Alaska meshes, scored with
#   python -m workflow.core.vgrid_eval --hgrid <fix>/hgrid.gr3 \
#          --candidates docs/vgrid_candidates_alaska.yaml --out vgrid_eval.txt
# Each entry is a modelsetup.yaml vgrid: block; the first is the cost
# reference (prisms = 1.00). Copy the chosen one into modelsetup.yaml.

# Alaska recipe of M26/M27 and M70-M72 (made for meshes clipped at 3 m)
current:
  dz_bot_min: 0.5
  a_vqs0: 0.0
  theta_b: 0.0
  classes:
    - [1.0, 2, 2.0]
    - [40.0, 15, 2.0]
    - [100.0, 23, 2.5]
    - [300.0, 31, 3.7]
    - [500.0, 35, 4.2]
    - [700.0, 38, 4.42]
    - [1000.0, 40, 4.9]
    - [1500.0, 40, 5.45]
    - [2000.0, 41, 5.8]
    - [10000.0, 51, 7.5]

# Hybrid: nodes >= 3 m exactly as current; shallower nodes (land included)
# on STOFS-3D-Atlantic's shallow classes (about 0.5 m layers, 6 at 3 m)
hybrid_atl:
  dz_bot_min: 0.5
  a_vqs0: 0.0
  theta_b: 0.0
  classes:
    - [1.0, 2, 2.0]
    - [40.0, 15, 2.0]
    - [100.0, 23, 2.5]
    - [300.0, 31, 3.7]
    - [500.0, 35, 4.2]
    - [700.0, 38, 4.42]
    - [1000.0, 40, 4.9]
    - [1500.0, 40, 5.45]
    - [2000.0, 41, 5.8]
    - [10000.0, 51, 7.5]
  shallow:
    depth: 3.0
    dz_bot_min: 0.1
    classes:
      - [1.0, 3, 0.0001]
      - [2.0, 5, 0.0001]
      - [3.0, 7, 0.0001]

# Hybrid with a steeper shallow ramp (about 11 layers at 3 m, ~0.3 m),
# smaller step to the deep side's 13 layers at the 3 m seam
hybrid_ramp:
  dz_bot_min: 0.5
  a_vqs0: 0.0
  theta_b: 0.0
  classes:
    - [1.0, 2, 2.0]
    - [40.0, 15, 2.0]
    - [100.0, 23, 2.5]
    - [300.0, 31, 3.7]
    - [500.0, 35, 4.2]
    - [700.0, 38, 4.42]
    - [1000.0, 40, 4.9]
    - [1500.0, 40, 5.45]
    - [2000.0, 41, 5.8]
    - [10000.0, 51, 7.5]
  shallow:
    depth: 3.0
    dz_bot_min: 0.1
    classes:
      - [1.0, 3, 0.0001]
      - [2.0, 7, 0.0001]
      - [3.0, 12, 0.0001]

# Optimum candidates: one class list for the whole mesh, near-uniform
# shallow layers, finer shelf surface and bottom (theta_b), z-like deep.
