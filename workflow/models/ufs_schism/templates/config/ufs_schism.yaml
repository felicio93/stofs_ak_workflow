# =============================================================================
# ufs_schism.yaml — UFS-SCHISM specific settings
# =============================================================================

# Where to write DATM forcing in each monthly I dir.
datm_subdir: forcing
datm_filename_template: "datm_{YYYYMM}.nc"

# DATM time axis: seconds since first day of month 00Z.
datm_time_units_template: "seconds since {YYYY}-{MM}-01 00:00:00"

# Fill value used for DATM vars.
datm_fill_value: -9999.0

# Atmospheric model time step (seconds).
dt_atmos: 720

# =============================================================================
# Coupling interval
# =============================================================================
# The UFS runSeq @N interval (seconds) controls how often ATM and OCN
# exchange fields via the CMEPS mediator.
#
# IMPORTANT: This should match the atmospheric FORCING frequency, NOT
# SCHISM's internal dt. Setting coupling_dt equal to SCHISM's dt causes
# ESMF field exchanges every timestep (1440 exchanges/day for dt=60),
# which is ~60x more expensive than coupling at hourly intervals.
#
# Recommended values:
#   3600  : hourly coupling (matches ERA5/DATM 1-hour forcing, default)
#   1800  : 30-minute coupling (finer, more expensive)
#   7200  : 2-hourly coupling (coarser, cheaper)
#
# The DATM forcing files generated by gen_datm.py are hourly (1-hour
# intervals), so coupling_dt=3600 is physically correct for this workflow.
coupling_dt: 3600

# =============================================================================
# UFS model coupling configuration
# =============================================================================
# IMPORTANT: The petlist_bounds below are job-size specific and MUST be
# updated to match your SLURM job allocation before running setup_run.
#
# The bounds use 0-based indexing of MPI tasks across all components:
#   med_petlist_bounds: first and last PET index for the mediator (CMEPS)
#   atm_petlist_bounds: first and last PET index for the atmosphere (DATM)
#   ocn_petlist_bounds: first and last PET index for the ocean (SCHISM)
#
# Example for a job with 160 ATM + 3194 OCN = 3354 total tasks:
#   med_petlist_bounds: "0 159"    <- mediator shares ATM tasks (0..159)
#   atm_petlist_bounds: "0 159"    <- DATM: tasks 0..159
#   ocn_petlist_bounds: "160 3353" <- SCHISM: tasks 160..3353
#
# Adjust these values to match your job's #SBATCH -n (total MPI tasks)
# and the SCHISM decomposition used.
# =============================================================================
med_model: "cmeps"
atm_model: "datm"
ocn_model: "schism"
cpl_mode: "coastal"
coupling_config: "none"
run_type: "startup"
case_name: "ufs.cpld"
restart_n: 9999
med_petlist_bounds: "0 159"
atm_petlist_bounds: "0 159"
ocn_petlist_bounds: "160 3353"
med_omp_num_threads: 1
atm_omp_num_threads: 1
ocn_omp_num_threads: 1
