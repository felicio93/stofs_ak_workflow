# =============================================================================
# ufs_schism_cice.yaml — UFS-SCHISM+CICE parameters
# =============================================================================
# Self-contained: only <model_type>.yaml is loaded, so the SCHISM keys shared
# by every model are included here (Part 1) before the model-specific keys
# (Part 2: DATM and coupling).

# =============================================================================
# PART 1 — SCHISM parameters (shared by all models)
# =============================================================================
# Temperature and salinity assigned to estuary nodes (shallow nodes with
# depth < estuary_depth_threshold in modelsetup.yaml). These represent the
# background coastal/estuarine water properties.
estuary_temp: 10.0   # degrees C  (reasonable for Alaska coastal waters)
estuary_sal:  0.0    # psu        (freshwater end-member)

# Temperature and salinity assigned to mesh nodes that fall outside the
# HYCOM data coverage (safety fallback -- should rarely/never be triggered
# if the HYCOM download domain is generous).
outside_temp: 10.0
outside_sal:  0.0

# Open boundary condition flags for each open boundary in hgrid.gr3 (in order).
# Format: [[iettype, ifltype, itetype, isatype], ...]
#   iettype: elevation   (0=none, 1=elev.th, 2=constant, 3=tidal, 4=th.nc, 5=tidal+th.nc)
#   ifltype: velocity    (0=none, 1=flux.th, 2=constant, 3=tidal, 4=th.nc, 5=tidal+th.nc)
#   itetype: temperature (0=none, 1=T.th, 2=constant, 4=th.nc)
#   isatype: salinity    (0=none, 1=S.th, 2=constant, 4=th.nc)
open_boundary_flags: [[5, 5, 4, 4], [5, 5, 4, 4]]

# Tidal nudging relaxation factors per boundary (required when itetype/isatype != 0).
tobc: [0.01, 0.01]   # temperature nudging factor per boundary
sobc: [0.01, 0.01]   # salinity nudging factor per boundary

# Tidal constituents for bctides.in.
# Options:
#   'major' : 8 major constituents  [Q1, O1, P1, K1, N2, M2, S2, K2]
#   'all'   : all 15 available in TPXO9:
#              [M2, S2, N2, K2, K1, O1, P1, Q1, Mm, Mf, M4, MN4, MS4, 2N2, S1]
#   list    : explicit subset, e.g. [M2, S2, K1, O1, N2, P1, Q1, K2, Mm, Mf]
tidal_constituents: major

# Cutoff depth for applying earth tidal potential (metres).
tidal_cutoff_depth: 50.0

# Open boundary segment IDs for *th.nc files (gen_3Dth step).
# Format: [id1, id2, ...] matching the gen_3Dth_from_nc.in convention.
# For the AK mesh: 2 open boundaries, IDs 1 and 2.
open_boundaries: [1, 2]

# Time step of the HYCOM input data in seconds (daily data = 86400).
hycom_dt: 86400.0

# Longitude handling of the HYCOM utilities (gen_hotstart, gen_3Dth, gen_nudge).
# They do not convert longitudes, so hgrid.ll and the HYCOM stacks must share
# one convention. Before submitting, the workflow compares both and uses the
# plain executable or its _lonshift variant (HYCOM 0-360 -> -180..180).
#   auto  : choose by comparing hgrid.ll with the HYCOM longitudes (default)
#   true  : always use the _lonshift executables
#   false : never shift
hycom_lon_shift: auto

# Output stride for the nudging timeseries (1 = output every input timestep).
nudge_stride: 1

# Parameters for the hotstart .in file (passed to gen_hot_from_nc.in).
# nbin and mne_bin are internal binning parameters for the Fortran interpolation.
# The defaults from the SCHISM repository work for most cases.
nbin:    60000
mne_bin: 1600

# =============================================================================
# Run management (Phase 4)
# =============================================================================
# When a monthly run completes and its end-of-month hotstart is combined,
# should the workflow automatically symlink that hotstart into the NEXT month's
# run directory and launch it?
#   true  : chain month N -> month N+1 automatically (normal production run)
#   false : single-group testing. submit_run launches the FIRST pending group
#           only; later groups have no hotstart.nc link until you chain them
#           yourself, so do not use false for multi-group production runs.
chain_hotstart: true

# =============================================================================
# PART 2 — UFS-SCHISM+CICE parameters
# =============================================================================
# Where to write DATM forcing in each monthly I dir.
datm_subdir: forcing
datm_filename_template: "datm_{YYYYMM}.nc"

# Atmospheric model time step (seconds).
dt_atmos: 720

# =============================================================================
# Coupling interval
# =============================================================================
# The UFS runSeq @N interval (seconds) controls how often ATM and OCN
# exchange fields via the CMEPS mediator.
#
# IMPORTANT: This should match the atmospheric FORCING frequency, NOT
# SCHISM's internal dt. Setting coupling_dt equal to SCHISM's dt causes
# ESMF field exchanges every timestep (1440 exchanges/day for dt=60),
# which is ~60x more expensive than coupling at hourly intervals.
#
# Recommended values:
#   3600  : hourly coupling (matches ERA5/DATM 1-hour forcing, default)
#   1800  : 30-minute coupling (finer, more expensive)
#   7200  : 2-hourly coupling (coarser, cheaper)
#
# The DATM forcing files generated by gen_datm.py are hourly (1-hour
# intervals), so coupling_dt=3600 is physically correct for this workflow.
# UFS-SCHISM+CICE: the ice-ocean exchange (freezing potential, melt water,
# salt, stress) needs a short interval; the UFS-Coastal Bering test and
# Scott Durski's Bering runs couple every 180 s (= ice_dt). Must be a
# multiple of ice_dt and of the SCHISM dt.
coupling_dt: 180

# =============================================================================
# UFS model coupling configuration
# =============================================================================
# IMPORTANT: The petlist_bounds below are job-size specific and MUST be
# updated to match your SLURM job allocation before running setup_run.
#
# The bounds use 0-based indexing of MPI tasks across all components:
#   med_petlist_bounds: first and last PET index for the mediator (CMEPS)
#   atm_petlist_bounds: first and last PET index for the atmosphere (DATM)
#   ocn_petlist_bounds: first and last PET index for the ocean (SCHISM)
#
# Example for a job with 160 ATM + 3194 OCN = 3354 total tasks:
#   med_petlist_bounds: "0 159"    <- mediator shares ATM tasks (0..159)
#   atm_petlist_bounds: "0 159"    <- DATM: tasks 0..159
#   ocn_petlist_bounds: "160 3353" <- SCHISM: tasks 160..3353
#
# Adjust these values to match your job's #SBATCH -n (total MPI tasks)
# and the SCHISM decomposition used.
# =============================================================================
med_model: "cmeps"
atm_model: "datm"
ocn_model: "schism"
ice_model: "cice6"
cpl_mode: "coastal"
coupling_config: "none"
ocn_meshloc: "element"      # SCHISM cap meshloc: element (UFS-Coastal tests) | node
case_name: "ufs.cpld"
# Job layout (keep fix/run_test -N/-n in sync): 43 nodes x 80 = 3440 cores
#   ATM (DATM):   PETs    0 -   79   (80)
#   ICE (CICE):   PETs   80 -  239  (160)  = ice_in nprocs
#   OCN (SCHISM): PETs  240 - 3433 (3194)  same SCHISM count as ufs_schism
#   MED (CMEPS):  PETs    0 -  239  (ATM + ICE tasks)
med_petlist_bounds: "0 239"
atm_petlist_bounds: "0 79"
ice_petlist_bounds: "80 239"
ocn_petlist_bounds: "240 3433"
med_omp_num_threads: 1
atm_omp_num_threads: 1
ice_omp_num_threads: 1
ocn_omp_num_threads: 1

# =============================================================================
# PART 3 — CICE
# =============================================================================
# The CICE grid, land mask, bathymetry and ESMF mesh are made from the SCHISM
# mesh by gen_cice_grid (--phase setup; settings in modelsetup.yaml,
# cice_grid:) into fix/cice/. ice_in is made per group by gen_ice_in from the
# template fix/ice_in (physics choices live there, from the UFS-Coastal Bering
# Sea runs); the keys below are what changes between projects.
#
# CICE time step (s). The coupling interval (coupling_dt) must be a multiple.
ice_dt: 180
# CICE blocks (cells). With max_blocks = -1 CICE sizes the block arrays itself;
# land-only blocks are dropped, so smaller blocks balance better.
ice_block_size_x: 20
ice_block_size_y: 20
# Allowed difference (degrees) between the ESMF mesh centres and CICE's own
# cell centres (UFS default 0.1; the Bering runs use 0.5).
ice_eps_imesh: 0.5
# Initial ice of the first group:
#   none       start ice free (ice_ic = 'none'), as the Bering runs do from
#              October; the ice grows from the ocean's freezing potential
#   <path>     a CICE restart file used as the initial state
ice_initial: none
# Restoring at the open edges of the CICE grid from daily boundary files
# BRY_<year>.nc in ice_bry_dir (CICE's sea_ice_time_bry, north edge only in
# this CICE version). false: open edges without restoring (no ice comes in).
ice_restore_bry: false
ice_bry_dir: ""
# CICE history: one file per period. 'd' daily means, 'h' with
# ice_history_n hours (e.g. 'h' and 6 -> 6-hourly means).
ice_history_freq: d
ice_history_n: 1
# Chain the CICE restart from each group to the next (with chain_hotstart).
chain_cice_restart: true
